name: microbiome_pipeline
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # --- Python core ---
  - python=3.10
  - pandas=2.3.*
  - numpy=2.2.*
  - scipy=1.15.*
  - scikit-learn=1.7.*
  - statsmodels=0.14.*
  - scikit-bio=0.7.*
  - matplotlib=3.10.*
  - seaborn=0.13.*
  - openpyxl=3.1.*
  - biom-format=2.1.*
  - upsetplot=0.9.*
  - matplotlib-venn=1.1.*
  - pyyaml
  - joblib
  - biopython

  # --- Orchestration & notebooks ---
  - snakemake=7.32.4
  - jupyter

  # --- Pip (only if later needed) ---
  - pip
