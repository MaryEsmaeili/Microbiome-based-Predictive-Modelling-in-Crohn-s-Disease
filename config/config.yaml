# config/config.yaml
paths:
  meta: data/meta/model_table_pooled.csv

id_column_candidates: ["Sample", "Sample_ID", "index", "sample_id"]

ranks:
  - genus
  - species

cv_modes:
  genus:   ["stratified_kfold", "leave_site_out"]
  species: ["stratified_kfold", "leave_site_out"]   # LSO برای species هم فعال

models:
  - logreg
  - l1
  - rf

seed: 42
n_folds: 5
